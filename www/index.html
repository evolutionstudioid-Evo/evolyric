<style>
:root{--bg:#15110e;--fg:#f3ece3;--mut:#a89c8e;--card:#221c17;--ln:#33291f;--acc:#f0a04b;--m:#6ab0ff;--f:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 'Atkinson Hyperlegible',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,.it b,.ltr{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.v{display:none;height:100%;flex-direction:column;position:relative}.v.on{display:flex}
#play{--bg:#0d0a08;--fg:#f3ece3;--mut:#a89c8e;--card:#221c17;--ln:#33291f;--acc:#f0a04b;--m:#6ab0ff;--f:#ff6b6b;background:var(--bg);color:var(--fg)}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px;min-height:52px}
.hd h1{margin:0;flex:1;display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.lg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 8px rgba(240,160,75,.28))}
.wm{display:flex;flex-direction:column;line-height:1}
.wm span{font-size:27px;font-weight:800;letter-spacing:-.9px;color:var(--fg)}
.wm span i{font-style:normal;font-weight:600;letter-spacing:-.6px;background:linear-gradient(100deg,#f0a04b 10%,#ffd9a0 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm small{margin-top:4px;font:600 8.5px/1 'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:2.6px;text-transform:uppercase;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:12px;font-size:20px;background:var(--card)}
.sb{display:flex;gap:8px;padding:0 12px 8px}
.sb input,.fld{flex:1;min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.pill{background:var(--acc);color:#15110e;border-radius:12px;padding:0 14px;font-weight:700;min-height:44px}

.lk{display:flex;gap:18px;padding:12px;flex-wrap:wrap}.lk button{color:var(--acc);text-decoration:underline;padding:8px 0}
#ptitle{flex:1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
#secs{position:relative;display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;min-height:40px}
.chip{flex:none;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--ln);font-weight:700;opacity:.7}
.chip.on{background:#2b231c;border-color:currentColor;opacity:1}
#lyr{flex:1;overflow-y:auto;position:relative;padding:0 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 36px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 36px,#000 calc(100% - 44px),transparent 100%)}
.ln{line-height:1.45;white-space:pre-wrap;text-align:center;font-weight:700}.sec{color:var(--acc);font-size:.6em;font-weight:700;margin:1.1em 0 .2em;text-align:center}#ttl+.sec{margin-top:0}#ttl{font:800 60px/1.1 'Bricolage Grotesque',system-ui,sans-serif;text-align:center;margin:0 0 24px;color:var(--fg);overflow-wrap:anywhere}
.m{color:var(--m)}.f{color:var(--f)}
.ctl{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ctl label{flex:1;display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc)}
#pp{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#15110e;font-size:22px}
#menu,#drawer{position:absolute;z-index:20;background:var(--card);border:1px solid var(--ln);border-radius:14px;display:none}
#menu{right:10px;top:56px;padding:6px;min-width:190px}#menu button{display:block;width:100%;text-align:left;padding:12px}
#drawer{display:flex;flex-direction:column;top:0;bottom:0;left:0;width:min(86vw,340px);border-radius:0 16px 16px 0;z-index:30;transform:translateX(-102%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}#drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}#scrim{position:absolute;inset:0;z-index:25;background:#000;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}#scrim.open{opacity:.45;visibility:visible;transition:opacity .3s,visibility 0s}@media(prefers-reduced-motion:reduce){#drawer,#scrim{transition:none!important}}
#fsx{display:none;position:absolute;top:8px;right:8px;z-index:15;opacity:.35;width:40px;height:40px;border-radius:50%;background:var(--card)}

#edit .sb{padding-bottom:6px}#edit .sb .fld{padding:5px 10px;line-height:1.25;border-radius:10px}
.ed{display:flex;flex:1;min-height:0;gap:8px;padding:0 10px 10px}
#side{order:1;width:94px;flex:0 0 94px;overflow-y:auto;padding:0 2px 8px 0;display:flex;flex-direction:column;gap:6px}
#ta{order:0;flex:1;min-width:0;min-height:0;height:100%;resize:none;background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:0;padding:12px;line-height:1.5;font:16px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;caret-color:var(--acc)}
#side button{flex:none;line-height:1.15;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 6px;font-size:14px}
.tb{display:flex;gap:5px;padding:0 12px 6px;flex-wrap:wrap}.tb button.on{background:var(--acc)!important;color:#15110e;border-color:var(--acc)!important}.tb button{background:var(--card);border-radius:8px;padding:4px 9px;font-size:13px;line-height:1.2;border:1px solid var(--ln)}
#ctx,#cbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#ctx.on,#cbox.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:8px;min-width:240px;max-width:86vw;display:flex;flex-direction:column;gap:2px}
.sheet h3{margin:6px 10px 8px;font-size:15px;color:var(--mut);font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sheet button{text-align:left;padding:13px 12px;border-radius:10px}.sheet button:active{background:var(--ln)}.sheet .del{color:var(--f)}
#cbox .sheet input{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px;margin:0 4px 8px}
.sws{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 10px}.sws button{width:30px;height:30px;border-radius:50%;padding:0}.sws button.on{outline:3px solid var(--fg);outline-offset:2px}
#cok{background:var(--acc);color:#15110e;text-align:center!important;font-weight:700}
#eX.arm{background:var(--f);color:#fff}
#favL.on,#favD.on{background:var(--acc);color:#15110e}#svw{color:var(--f);font-size:13px;font-weight:700}#svw[hidden]{display:none}
select.fld{flex:none;width:auto}#txt{max-width:960px;margin:0 auto}.end{height:2px;margin:56px auto 0;width:78%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--mut),transparent)}mark{color:inherit;border-radius:.2em;padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}#hlbar{align-items:center}#hlbar[hidden]{display:none!important}#hlbar .sw{width:24px;height:24px;border-radius:50%;padding:0}#secbar{align-items:center}#secbar[hidden]{display:none!important}#secbar b{font-family:'Bricolage Grotesque',sans-serif;font-size:13px;margin-right:4px}#secbar .warn{background:var(--f);color:#fff}

[hidden]{display:none!important}
.tabs{display:flex;gap:6px;padding:0 12px 8px}.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--ln);font-weight:700;color:var(--mut)}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#15110e}
.crumb{display:flex;align-items:center;gap:10px;padding:0 12px 8px}.crumb button{color:var(--acc);font-weight:700;padding:6px 0;white-space:nowrap}.crumb b{flex:1;min-width:0;font:800 20px/1.2 'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#dcat{max-width:118px}
.catsel{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#nbox,#catbox,#addbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#nbox.on,#catbox.on,#addbox.on{display:flex}
#nbox .sheet,#catbox .sheet{width:min(92vw,360px)}
#nbox .sheet input,#catbox .sheet input{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:0 4px 6px;flex:1;min-width:0}
.err{color:var(--f);font-size:13px;margin:0 8px 6px;min-height:0}.err:empty{display:none}
#nok,#cdone{background:var(--acc);color:#15110e;text-align:center!important;font-weight:700}#ncx{text-align:center!important;color:var(--mut)}
#catl{max-height:42vh;overflow:auto;margin-bottom:6px}.nrow{display:flex;gap:6px;align-items:center}.nrow button{background:var(--ln);border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:6px}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 8px;border-bottom:1px solid var(--ln);border-radius:0}
.arow span:nth-child(2){flex:1;min-width:0}.arow em{font-style:normal;font-size:12px;color:var(--mut)}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:#15110e}
.arow.sel .chk{background:var(--acc);border-color:var(--acc)}
.arow:disabled{opacity:.45;cursor:default}.arow:disabled .chk{border-style:dashed}
.asheet{background:var(--card);border:1px solid var(--ln);border-radius:16px;width:min(94vw,520px);height:min(86vh,640px);height:min(86dvh,640px);display:flex;flex-direction:column;overflow:hidden}
.ah{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 12px}.ah>button:first-child{justify-self:start;color:var(--acc);font-weight:700;padding:8px 2px}.ah>button:last-child{justify-self:end}.ah>div{text-align:center;line-height:1.2}.ah b{display:block;font-family:'Bricolage Grotesque',sans-serif}.ah small{color:var(--mut);font-size:12px}
.pill:disabled{opacity:.4;cursor:default}
#aItems{flex:1;overflow:auto;padding:0 10px 10px;overscroll-behavior:contain}
#note{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:90;background:#f3ece3;color:#15110e;padding:10px 16px;border-radius:20px;font-weight:700;font-size:14px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}#note.on{opacity:1;transform:translate(-50%,0)}#note.bad{background:var(--f);color:#fff}
#auth{flex:none;position:relative}
.signin{min-height:38px;padding:0 15px;border-radius:12px;background:var(--card);border:1px solid var(--ln);font-weight:700;font-size:14px;color:var(--fg);transition:border-color .15s,background .15s}.signin:hover{border-color:var(--acc)}
.avb{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid var(--ln);overflow:hidden;background:var(--card);transition:border-color .15s}.avb:hover,.avb[aria-expanded=true]{border-color:var(--acc)}
.av{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffbe6b,#e8812a);color:#15110e;font:800 15px/1 'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
#amenu{position:absolute;z-index:40;right:12px;top:58px;width:min(264px,calc(100vw - 24px));background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);transform-origin:top right;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.mh{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--ln);margin-bottom:4px}.mh .av{width:42px;height:42px;flex:none;font-size:16px}.mh div{min-width:0}.mh b{display:block;font-family:'Bricolage Grotesque',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mh small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#amenu .mi{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:11px 10px;border-radius:9px}#amenu .mi:hover,#amenu .mi:focus-visible{background:var(--ln)}#amenu .mi:disabled{color:var(--mut);cursor:default;background:none}#amenu .mi em{font-style:normal;font-size:11px;border:1px solid var(--ln);border-radius:10px;padding:1px 7px}#amenu .mi.out{color:var(--f)}#amenu hr{border:0;border-top:1px solid var(--ln);margin:4px 0}
#authbox{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.58);padding:16px;visibility:hidden;opacity:0;transition:opacity .18s,visibility 0s .18s}#authbox.on{visibility:visible;opacity:1;transition:opacity .18s}
.acard{position:relative;width:min(100%,380px);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:30px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(8px) scale(.98);transition:transform .2s}#authbox.on .acard{transform:none}
.acard .xb{position:absolute;top:10px;right:10px;width:36px;height:36px;background:transparent;color:var(--mut);font-size:16px}.acard .lg{width:52px;height:52px;margin:0 auto 14px;display:block}
.acard h2{margin:0 0 6px;font:800 24px/1.15 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.4px}.acard .sub{margin:0 0 22px;color:var(--mut);font-size:15px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:12px;font:600 15px/1 'Atkinson Hyperlegible',system-ui,sans-serif;transition:background .15s,box-shadow .15s}.gbtn svg{width:20px;height:20px;flex:none}.gbtn:hover:not(:disabled){background:#f6f6f6;box-shadow:0 1px 3px rgba(0,0,0,.3)}.gbtn:disabled{opacity:.75;cursor:progress}
.gbtn.ld svg{display:none}.gbtn.ld::before{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid #cfcfcf;border-top-color:#4285F4;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.acard .err{margin:12px 0 0;font-size:14px}.priv{margin:16px 4px 6px;color:var(--mut);font-size:12.5px;line-height:1.45}.lnk{color:var(--acc);font-weight:700;padding:8px;font-size:14px}
@media(prefers-reduced-motion:reduce){#amenu,.acard,#authbox{animation:none!important;transition:none!important}}
/* Stable immersive fullscreen: keep original DOM hierarchy so every control remains clickable. */
#play.fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;min-height:0;z-index:1000;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#play.fs .hd{position:relative;z-index:10;min-height:44px;height:44px;padding:2px 10px;flex:none}

#play.fs #dr{display:flex!important;align-items:center;justify-content:center;width:38px;height:38px}
#play.fs #fsx{display:flex;align-items:center;justify-content:center;position:absolute;top:calc(env(safe-area-inset-top,0px) + 5px);right:10px;z-index:70;width:34px;height:34px;border-radius:50%;background:rgba(34,28,23,.72);color:var(--fg);opacity:.65;font-size:21px}

#play.fs #txt{padding-bottom:0!important}

#lyr{cursor:pointer}
.rangeCtl{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.rangeCtl label{flex:1;display:flex;flex-direction:column;font-size:12px;color:var(--mut);min-width:0}
.step{width:32px;height:32px;flex:0 0 32px;border:1px solid var(--ln);border-radius:9px;background:var(--card);font-size:19px;line-height:1;color:var(--fg)}
.step:active{background:var(--acc);color:#15110e}
.ctl{gap:9px}


@media(max-width:600px){
  #edit .ed{flex-direction:row;gap:6px;padding:0 8px 8px;min-height:0}
  #edit #side{width:76px;flex:0 0 76px;max-height:none;overflow-y:auto;overflow-x:hidden}
  #edit #side button{font-size:12px;padding:8px 4px;min-height:36px}
  #edit #ta{height:100%;min-height:0;margin:0;padding:10px;font-size:16px}
  #edit .tb{padding-left:8px;padding-right:8px}
}

/* ===== v17: Song Queue, Next Song, touch lock, motion polish ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.5,1)}
html,body{touch-action:pan-x pan-y} /* no double-tap zoom / pinch page zoom; scrolling stays; lyric canvas keeps its own pan-y */
button,select,.it{touch-action:manipulation}
/* queue toggle + panel (compact, right side) */
#qtg{position:absolute;top:var(--qt,100px);right:8px;z-index:12;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);background:rgba(34,28,23,.72);border:1px solid var(--ln);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.78;transition:transform .25s var(--spring),color .2s,border-color .2s,opacity .2s}
#qtg svg{width:18px;height:18px}
#qtg:active{transform:scale(.9)}
#qtg.has{color:var(--acc);border-color:rgba(240,160,75,.45);opacity:1}
#qtg b{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:#15110e;font:800 10px/16px 'Atkinson Hyperlegible',system-ui,sans-serif;text-align:center;transform:scale(0);transition:transform .32s var(--spring)}
#qtg.has b{transform:scale(1)}
#qtg.bump{animation:qbump .5s var(--spring)}
@keyframes qbump{35%{transform:scale(1.22)}}
#qp{position:absolute;top:calc(var(--qt,100px) + 44px);right:8px;z-index:11;width:min(184px,46vw);max-height:min(42%,250px);display:flex;flex-direction:column;background:rgba(34,28,23,.95);border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.45);overflow:hidden;transform-origin:top right;opacity:0;transform:translateY(-8px) scale(.92);visibility:hidden;pointer-events:none;transition:opacity .18s var(--ease),transform .24s var(--ease),visibility 0s .24s}

.qh0{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px 11px;font:700 10.5px/1 'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
#qx{width:30px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--mut);border-radius:8px;transition:background .15s}#qx:active{background:var(--ln)}#qx svg{width:12px;height:12px;transition:transform .25s var(--ease)}
#ql{overflow-y:auto;overscroll-behavior:contain;padding:0 4px 4px;position:relative}
.qi{display:flex;align-items:center;height:36px;border-radius:9px;position:relative;overflow:hidden;transition:height .22s var(--ease),opacity .2s,transform .22s var(--ease),background .15s,box-shadow .15s}
.qi.new{animation:qin .34s var(--ease)}
@keyframes qin{from{opacity:0;transform:translateX(14px)}}
.qi.out{height:0;opacity:0;transform:translateX(16px);pointer-events:none}

.qt{flex:1;min-width:0;display:flex;align-items:baseline;gap:5px;font-size:14px;line-height:1.2}
.qt i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--acc);flex:none;opacity:.9}
.qt span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qd{flex:none;width:30px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--mut);opacity:.6;border-radius:8px;transition:opacity .15s,color .15s,background .15s}
.qd:active{opacity:1;color:var(--f);background:rgba(255,107,107,.1)}
.qe{padding:6px 11px 12px;font-size:12.5px;color:var(--mut)}
/* Next Song: thin circle + thin chevron, no text */
#nxt{position:absolute;top:var(--nt,50%);right:10px;z-index:14;width:42px;height:42px;border-radius:50%;border:.75px solid rgba(255,255,255,.8);background:transparent;color:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(12px) scale(.86);visibility:hidden;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--ease),visibility 0s .4s,background .2s}
#nxt::before{content:"";position:absolute;inset:-7px;border-radius:50%}
#nxt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
#nxt.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity .35s var(--ease),transform .5s var(--spring),visibility 0s,background .2s}
#nxt.on::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:.75px solid rgba(255,255,255,.65);pointer-events:none;animation:nring 1.5s var(--ease) .4s 1 both}
@keyframes nring{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
#nxt.on:active{transform:scale(.9);background:rgba(255,255,255,.1)}
#nxt.on:active svg{transform:translateX(2px)}
/* Add to Queue / Open popup */
#qbg{position:fixed;inset:0;z-index:64;display:none;background:transparent}#qbg.on{display:block}
#qpop{position:fixed;z-index:65;width:min(204px,64vw);padding:5px;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.55);transform-origin:var(--ox,50%) var(--oy,0);opacity:0;transform:scale(.88);visibility:hidden;pointer-events:none;transition:opacity .14s,transform .2s var(--ease),visibility 0s .2s}

/* motion polish */
.v.on{animation:vin .3s var(--ease)}@keyframes vin{from{opacity:0}}
#ctx.on,#cbox.on,#nbox.on,#catbox.on,#addbox.on{animation:ofade .2s ease-out}
#ctx.on .sheet,#cbox.on .sheet,#nbox.on .sheet,#catbox.on .sheet,#addbox.on .asheet{animation:sheetin .32s var(--spring)}

#amenu{animation-duration:.22s;animation-timing-function:var(--ease)}
@media(prefers-reduced-motion:reduce){#qtg,#qtg b,#qp,.qi,#nxt,#nxt svg,#qpop,#qx svg,.pill,.ic,.step,.chip,#note{transition:none!important;animation:none!important}.v.on,.qi.new,#nxt.on::after,#dItems.stg>*,#ctx.on,#cbox.on,#nbox.on,#catbox.on,#addbox.on,#ctx.on .sheet,#cbox.on .sheet,#nbox.on .sheet,#catbox.on .sheet,#addbox.on .asheet{animation:none!important}}

<script>
const K='evolyric-v1',$=s=>document.querySelector(s);
const SPEED_BONUS=3,BOOST1=15+SPEED_BONUS,BOOST2=20+SPEED_BONUS; /* every speed value runs +3 faster */
const FMIN=12,FMAX=120;
const SPEED_SCALE=1; /* px/s per (speed x font-size x .12); ChatGPT build had x3 */
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const SAMPLE={id:'s1',title:'Contoh Lagu',artist:'EvoLyric',speed:5,font:32,lyrics:
'[Intro]\n(petik pelan)\n\n[Verse 1]\nLampu panggung mulai menyala\nSuara kita mengisi ruang\nSatu per satu baris mengalir\nTanpa kertas yang berserakan\n\n[Chorus]\nGulir saja, biar lirik berjalan\nKita bernyanyi sampai selesai\n\n[Male 1]\nBagian ini milik dia\n\n[Female 1]\nBagian ini milik aku\n\n[All]\nSatu suara, satu panggung\n\n[Interlude]\n(solo gitar)\n\n[Verse 2]\nSetelah lagu ini usai\nTepuk tangan jadi penutup\n\n[Rit]\nPelan… dan selesai'};
let songs=[],cur=null,ed=null,playing=false,boostSp=0,frac=0,last=0,fs=false,wl=null,skip=new Set(),g=null,delArm=0,t0,waiting=false,lastT=0,startEl=null,lastA=null,cats=[];
const SAMPLE_J=JSON.stringify(SAMPLE);let LK=K,LKC='evolyric-cats-v1'; /* active storage keys: guest = K/KC, signed-in = per-account cache (see cloud.js) */
try{const h=JSON.parse(localStorage.getItem('evolyric-auth-hint')||'null');if(h&&h.id&&localStorage.getItem(K+':u:'+h.id)!=null){LK=K+':u:'+h.id;LKC='evolyric-cats-v1:u:'+h.id}}catch(e){}
try{const r=localStorage.getItem(LK);songs=r?JSON.parse(r):[SAMPLE];if(!Array.isArray(songs))throw 0}catch(e){try{localStorage.setItem(LK+'-corrupt',localStorage.getItem(LK)||'')}catch(_){}songs=[SAMPLE]}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
let saveBad=0;const KC='evolyric-cats-v1';
const saveLocal=()=>{try{localStorage.setItem(LK,JSON.stringify(songs));localStorage.setItem(LKC,JSON.stringify(cats));if(saveBad){saveBad=0;$('#svw').hidden=true}}catch(e){saveBad=1;$('#svw').hidden=false}};
const save=()=>{saveLocal();if(window.Cloud)Cloud.touch()};
function toast(){}
let noteT;function note(m,bad){const n=$('#note');n.textContent=m;n.classList.toggle('bad',!!bad);n.classList.add('on');clearTimeout(noteT);noteT=setTimeout(()=>n.classList.remove('on'),2400)}
/* ---------- Categories data: category -> list of master song ids (songs are never copied) ---------- */
const cid=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cname=v=>String(v||'').replace(/\s+/g,' ').trim();
const byName=(a,b)=>a.name.localeCompare(b.name,'id');
(function loadCats(){
  let raw=null;try{raw=localStorage.getItem(LKC)}catch(e){}
  if(raw){try{const a=JSON.parse(raw);if(!Array.isArray(a))throw 0;cats=a.filter(c=>c&&c.id&&c.name).map(c=>({id:c.id,name:c.name,ids:Array.isArray(c.ids)?c.ids:[]}))}catch(e){try{localStorage.setItem(LKC+'-corrupt',raw)}catch(_){}cats=[]}}
  else{const f=songs.filter(x=>x.fav).map(x=>x.id);if(f.length){cats=[{id:cid(),name:'Favorites',ids:f}];save()}} /* one-time: old star flags become a normal category */

const mapUser=u=>{if(!u)return null;const m=u.user_metadata||{};return{id:u.id,name:m.full_name||m.name||(u.email||'').split('@')[0]||'User',email:u.email||m.email||'',avatar:m.avatar_url||m.picture||''}};
const initials=n=>{const w=String(n||'?').trim().split(/\s+/).filter(Boolean);return((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
function avatarEl(u){const d=E('span','av');const ini=()=>{d.textContent=initials(u.name)};
  if(u.avatar){const i=new Image();i.alt='';i.referrerPolicy='no-referrer';i.onerror=ini;i.src=u.avatar;d.append(i)}else ini();return d}
function renderAuth(){
  const box=$('#auth');box.textContent='';const u=user||(authPending?getHint():null);
  if(!u){const b=E('button','signin','Sign In');b.id='sib';b.onclick=()=>openAuth();box.append(b)}
  else{const b=E('button','avb');b.id='avb';b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Account menu: '+u.name);b.append(avatarEl(u));b.onclick=e=>{e.stopPropagation();toggleMenu()};box.append(b)}
  if(!u)closeMenu()}
function buildMenu(u){const m=$('#amenu');m.textContent='';
  const h=E('div','mh'),t=E('div');t.append(E('b','',u.name),E('small','',u.email));if(window.Cloud&&user){const cs=Cloud.statusText();if(cs)t.append(E('small','cst',cs))}h.append(avatarEl(u),t);m.append(h);
  const it=(l,f,o)=>{const b=E('button','mi'+(o&&o.out?' out':''),l);b.setAttribute('role','menuitem');if(o&&o.soon){b.disabled=true;b.append(E('em','','Soon'))}else b.onclick=f;m.append(b)};
  it('Profile',null,{soon:1});
  it('My Library',()=>{closeMenu();lib.v='all';lib.id=null;$('#q').value='';refresh();$('#items').scrollTop=0});
  it('Account Settings',null,{soon:1});
  m.append(E('hr'));it('Sign Out',signOut,{out:1})}
function toggleMenu(){$('#amenu').hidden?openMenu():closeMenu()}
function openMenu(){const u=user||getHint();if(!u)return;buildMenu(u);$('#amenu').hidden=false;const b=$('#avb');b&&b.setAttribute('aria-expanded','true');const f=$('#amenu .mi:not(:disabled)');f&&f.focus({preventScroll:true})}
function closeMenu(){$('#amenu').hidden=true;const b=$('#avb');b&&b.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{if(!$('#amenu').hidden&&!e.target.closest('#amenu'))closeMenu()});
let authFrom=null;
function openAuth(err){authFrom=document.activeElement;setBusy(false);$('#aerr').textContent=err||'';const a=$('#authbox');a.classList.add('on');a.setAttribute('aria-hidden','false');setTimeout(()=>$('#gbtn').focus({preventScroll:true}),30)}
function closeAuth(){const a=$('#authbox');a.classList.remove('on');a.setAttribute('aria-hidden','true');authFrom&&authFrom.focus&&authFrom.focus({preventScroll:true})}
function setBusy(on){const g=$('#gbtn');g.disabled=on;g.classList.toggle('ld',on);g.querySelector('span').textContent=on?'Connecting to Google…':'Continue with Google'}
$('#atX').onclick=$('#atGuest').onclick=closeAuth;$('#authbox').onclick=e=>{if(e.target.id==='authbox')closeAuth()};
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#authbox').classList.contains('on'))closeAuth();else if(!$('#amenu').hidden){closeMenu();const b=$('#avb');b&&b.focus()}});
$('#gbtn').onclick=async()=>{
  $('#aerr').textContent='';
  if(!AUTH_ON)return void($('#aerr').textContent='Google sign-in is not configured yet. Guest Demo keeps working in the meantime.');
  if(!navigator.onLine)return void($('#aerr').textContent='You appear to be offline. Connect to the internet and try again.');
  setBusy(true);
  try{await ensureClient();
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
    if(error)throw error;
    setTimeout(()=>{if($('#authbox').classList.contains('on'))setBusy(false)},8000) /* if the redirect never happens */
  }catch(e){setBusy(false);$('#aerr').textContent='Sign-in could not start. '+(e&&e.message?e.message:'Please try again.')}};
function loadSDK(){return new Promise((ok,no)=>{if(window.supabase)return ok();const s=document.createElement('script');s.src='vendor/supabase.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load the sign-in module.'));document.head.append(s)})}
let clientP=null;
function ensureClient(){return clientP||(clientP=loadSDK().then(()=>{
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  sb.auth.onAuthStateChange((ev,ses)=>{ /* single listener; never call supabase APIs synchronously in here */
    if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='USER_UPDATED'||ev==='TOKEN_REFRESHED'){if(ses&&ses.user)applyUser(ses.user);else if(ev==='INITIAL_SESSION')applyUser(null)}
    else if(ev==='SIGNED_OUT')applyUser(null)});
  return sb}).catch(e=>{clientP=null;throw e}))}
function applyUser(u){const was=user&&user.id,n=mapUser(u);authPending=false;user=n;setHint(n);renderAuth();
  if(n&&was!==n.id&&$('#authbox').classList.contains('on'))closeAuth();
  if(n&&profSynced!==n.id){profSynced=n.id;setTimeout(()=>syncProfile(n),0)}
  if(window.Cloud){if(n)Cloud.signedIn(n);else Cloud.signedOut()}}
async function syncProfile(n){ /* refresh display fields only; row + email are created/owned by the DB trigger, identity comes from the JWT via RLS */
  try{const{error}=await sb.from('profiles').update({display_name:n.name,avatar_url:n.avatar||null}).eq('id',n.id);if(error)console.warn('profile sync:',error.message)}catch(e){console.warn('profile sync failed',e)}}
async function signOut(){closeMenu();const had=user;setHint(null);user=null;profSynced=null;renderAuth();
  try{if(sb){if(window.Cloud)await Cloud.flush(4000);await sb.auth.signOut()}note('Signed out')}catch(e){note('Signed out on this device')}}
/* ---------- Cloud sync hooks (logic lives in cloud.js) ---------- */
function readLib(u){const a=u?K+':u:'+u:K,b=u?KC+':u:'+u:KC;let ex=false,s=[JSON.parse(SAMPLE_J)],c=[];
  try{const r=localStorage.getItem(a);if(r!=null){ex=true;const p=JSON.parse(r);if(Array.isArray(p))s=p.filter(x=>x&&x.id)}}catch(e){}
  try{const r=localStorage.getItem(b);if(r){const p=JSON.parse(r);if(Array.isArray(p))c=p.filter(x=>x&&x.id&&x.name).map(x=>({...x,ids:Array.isArray(x.ids)?x.ids:[]}))}}catch(e){}
  const ok=new Set(s.map(x=>x.id));c.forEach(x=>x.ids=[...new Set(x.ids)].filter(i=>ok.has(i)));return{songs:s,cats:c,exists:ex}}
if(window.Cloud)Cloud.init({
  client:()=>ensureClient(),
  get:()=>({songs,cats}),
  put:(s,c)=>{songs=s;cats=c},
  saveLocal,
  render:()=>refresh(),
  busy:()=>!$('#list').classList.contains('on'),
  notify:note,
  readLib,
  isSample:g=>JSON.stringify(g)===SAMPLE_J,
  useKeys:u=>{LK=u?K+':u:'+u:K;LKC=u?KC+':u:'+u:KC},
  activeUid:()=>LK===K?null:LK.slice(K.length+3),
  dropUser:u=>{try{localStorage.removeItem(K+':u:'+u);localStorage.removeItem(KC+':u:'+u)}catch(e){}},
  onStatus:()=>{const b=document.querySelector('#amenu .cst');if(b)b.textContent=Cloud.statusText()}
});
async function initAuth(){
  /* surface OAuth errors returned in the URL */
  const qs=new URLSearchParams(location.search),hs=new URLSearchParams(location.hash.replace(/^#/,'')),er=qs.get('error_description')||hs.get('error_description');
  if(er){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  renderAuth();
  if(!AUTH_ON){setHint(null);if(window.Cloud)Cloud.signedOut();if(er)openAuth(er);return}
  try{await ensureClient();const{data,error}=await sb.auth.getSession();if(error)throw error;applyUser(data.session?data.session.user:null)}
  catch(e){authPending=false;if(!navigator.onLine){renderAuth()}else{setHint(null);user=null;renderAuth();if(window.Cloud)Cloud.signedOut()}}
  if(er)openAuth(er)}
initAuth();
refresh();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
