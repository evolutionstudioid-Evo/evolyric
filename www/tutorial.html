<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a0807"><title>Panduan EvoLyric</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one portrait 9:16 slide centred on a dark stage, controls beneath. Everything inside a slide is sized in cqw so it scales as a whole. */
:root{
  --bg:#0a0807;        /* stage black, warm */
  --card:#1c1612;      /* lyric-card surface */
  --ln:#352a20;        /* hairlines */
  --fg:#f3ece3;        /* text */
  --mut:#a89c8e;       /* secondary text */
  --acc:#f0a04b;       /* EvoLyric orange */
  --blue:#4da3ff;--pink:#ff7eb6;--violet:#c4a5ff;--brown:#e8a15a;--yel:#ffd23f;--red:#ff5d5d;--grn:#4ade80;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;background:#0a0807}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));overflow:hidden;margin:0}
.top{display:flex;align-items:center;gap:10px;width:100%;max-width:480px;justify-content:space-between}
.top b{font:700 15px var(--disp);color:var(--acc);letter-spacing:.2px}
.lang{display:flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 12px;font:600 12px var(--body);color:var(--mut)}
.lang button[aria-pressed=true]{background:var(--acc);color:#1a1209}
.lang button:focus-visible,.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{flex:1;min-height:0;aspect-ratio:9/16;max-width:100%;position:relative;border-radius:22px;overflow:hidden;background:#100c09;border:1px solid var(--ln);container-type:size;touch-action:pan-y}
.sl{position:absolute;inset:0;padding:9cqw 8cqw 12cqw;display:flex;flex-direction:column;gap:3.4cqw;opacity:0;transform:translateX(8%);transition:opacity .45s,transform .55s cubic-bezier(.22,1,.36,1);pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,#2a1c10 0,#100c09 60%)}
.sl.on{opacity:1;transform:none;pointer-events:auto}
.sl.past{transform:translateX(-8%)}
.kick{font:600 3.3cqw var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
h2{margin:0;font:800 9.4cqw/1.05 var(--disp);text-wrap:balance;letter-spacing:-.01em}
p{margin:0;font-size:4.5cqw;line-height:1.45;color:var(--mut);text-wrap:pretty}
p b,li b{color:var(--fg);font-weight:600}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2.6cqw}
li{font-size:4.5cqw;line-height:1.4;color:var(--mut);padding-left:5.2cqw;position:relative}
li::before{content:"";position:absolute;left:0;top:.62em;width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--acc)}
.grow{flex:1}
/* phone mock */
.ph{align-self:center;width:62cqw;border-radius:6cqw;border:.6cqw solid #3a2d22;background:#0d0a08;padding:4cqw 3.4cqw;display:flex;flex-direction:column;gap:2cqw;box-shadow:0 3cqw 8cqw rgba(0,0,0,.55)}
.ph .tt{font:700 4.4cqw var(--disp);color:var(--acc);text-align:center}
.ph .ln{text-align:center;font:700 4.6cqw/1.35 var(--disp)}
.ph .sc{text-align:center;font:700 3cqw var(--body)}
.ph .rule{height:.35cqw;background:linear-gradient(90deg,transparent,var(--mut),transparent)}
.ph .nx{text-align:center;font:700 2.6cqw var(--body);color:var(--acc)}
.shot{align-self:center;height:auto;border-radius:5cqw;border:.5cqw solid #3a2d22;box-shadow:0 3cqw 8cqw rgba(0,0,0,.55);display:block}
.chips{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center}
.chip{font:700 2.8cqw var(--body);padding:.9cqw 2.4cqw;border-radius:9cqw;border:.3cqw solid currentColor}
/* gestures grid */
.gs{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw}
.g{border:1px solid var(--ln);background:var(--card);border-radius:4cqw;padding:3.4cqw;display:flex;flex-direction:column;gap:1.4cqw;align-items:flex-start}
.g svg{width:8cqw;height:8cqw;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.g b{font:700 4.1cqw var(--disp)}
.g span{font-size:3.5cqw;line-height:1.3;color:var(--mut)}
.sw{display:flex;gap:2.4cqw;justify-content:center}
.sw i{width:7cqw;height:7cqw;border-radius:50%;display:block}
.voices{display:flex;flex-direction:column;gap:1.6cqw}
.v{display:flex;align-items:center;gap:2.6cqw;font:700 4.2cqw var(--disp)}
.v i{width:3.4cqw;height:3.4cqw;border-radius:50%}
.logo{width:22cqw;height:22cqw}
.big{font:800 17cqw/.95 var(--disp);letter-spacing:-.02em}
.big em{font-style:normal;color:var(--acc)}
.step{display:flex;gap:3.4cqw;align-items:flex-start}
.step .n{flex:none;width:9cqw;height:9cqw;border-radius:50%;border:.4cqw solid var(--acc);color:var(--acc);font:700 4.6cqw/8.2cqw var(--disp);text-align:center}
.step p{font-size:4.5cqw}
.steps{display:flex;flex-direction:column;gap:3.6cqw}
.foot{position:absolute;left:8cqw;right:8cqw;bottom:4.4cqw;display:flex;justify-content:space-between;font-size:3cqw;color:var(--mut);opacity:.8}
.nav{display:flex;align-items:center;gap:14px;width:100%;max-width:480px;justify-content:center}
.nav button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:grid;place-items:center;color:var(--fg)}
.nav button[disabled]{opacity:.3;cursor:default}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ln);transition:.3s}
.dots i.on{background:var(--acc);width:18px;border-radius:4px}
@media(prefers-reduced-motion:reduce){.sl{transition:none}}
</style></head><body>

<div class="top"><button id="cl" aria-label="Close" style="all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><b>EvoLyric</b><div class="lang" role="group" aria-label="Language"><button id="bid" aria-pressed="true">ID</button><button id="ben" aria-pressed="false">EN</button></div></div>

<div class="stage" id="stage" aria-live="polite">

<!-- 1 cover -->
<section class="sl on">
  <div class="grow"></div>
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbe6b"/><stop offset="1" stop-color="#e8812a"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#g)"/><g stroke="#15110e" stroke-width="3.2" stroke-linecap="round"><path d="M13 12.5h14" opacity=".45"/><path d="M10 20h20"/><path d="M15 27.5h10" opacity=".45"/></g></svg>
  <div class="big">Evo<em>Lyric</em></div>
  <p data-id="Pembaca lirik untuk vokalis live. Lirik berjalan sendiri, kamu fokus tampil." data-en="The lyric reader for live singers. The lyrics scroll on their own, so you can focus on performing."></p>
  <div class="grow"></div>
  <p style="font-size:3.6cqw" data-id="Panduan singkat · geser untuk lanjut" data-en="Quick guide · swipe to continue"></p>
</section>

<!-- 2 sign in -->
<section class="sl">
  <div class="kick" data-id="Langkah 1" data-en="Step 1"></div>
  <h2 data-id="Masuk dengan Google" data-en="Sign in with Google"></h2>
  <div class="grow"></div>
  <div class="steps">
    <div class="step"><span class="n">1</span><p data-id="Buka app dan ketuk <b>Lanjut dengan Google</b>." data-en="Open the app and tap <b>Continue with Google</b>." data-html></p></div>
    <div class="step"><span class="n">2</span><p data-id="Pilih <b>username</b> kamu. Teman akan menemukanmu lewat nama ini." data-en="Pick your <b>username</b>. Friends will find you by it." data-html></p></div>
    <div class="step"><span class="n">3</span><p data-id="Selesai. Kamu <b>tetap masuk</b>, bahkan setelah app ditutup penuh." data-en="Done. You <b>stay signed in</b>, even after the app is fully closed." data-html></p></div>
  </div>
  <div class="grow"></div>
</section>

<!-- 3 add song -->
<section class="sl">
  <div class="kick" data-id="Langkah 2" data-en="Step 2"></div>
  <h2 data-id="Tambah lagu pertama" data-en="Add your first song"></h2>
  <div class="steps">
    <div class="step"><span class="n">1</span><p data-id="Ketuk <b>+</b> di Home, pilih <b>New song</b>." data-en="Tap <b>+</b> on Home and choose <b>New song</b>." data-html></p></div>
    <div class="step"><span class="n">2</span><p data-id="Isi judul, tempel lirik, lalu <b>Save</b>." data-en="Type a title, paste the lyrics, then <b>Save</b>." data-html></p></div>

<div class="nav"><button id="pv" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><div class="dots" id="dots"></div><button id="nx" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div>

<script>
(function(){
  var S=[].slice.call(document.querySelectorAll('.sl')),i=0,lang='id',dots=document.getElementById('dots');
  S.forEach(function(s,k){dots.appendChild(document.createElement('i'));
    var f=document.createElement('div');f.className='foot';f.innerHTML='<span>EvoLyric</span><span>'+(k+1)+' / '+S.length+'</span>';if(k&&k<S.length-1)s.appendChild(f)});
  function txt(){[].forEach.call(document.querySelectorAll('[data-id]'),function(e){var v=e.getAttribute('data-'+lang);if(e.hasAttribute('data-html'))e.innerHTML=v;else e.textContent=v})
    document.documentElement.lang=lang;document.getElementById('bid').setAttribute('aria-pressed',lang==='id');document.getElementById('ben').setAttribute('aria-pressed',lang==='en')}
  function go(n){n=Math.max(0,Math.min(S.length-1,n));i=n;S.forEach(function(s,k){s.classList.toggle('on',k===n);s.classList.toggle('past',k<n)});
    [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===n)});
    document.getElementById('pv').disabled=n===0;document.getElementById('nx').disabled=n===S.length-1}
  document.getElementById('pv').onclick=function(){go(i-1)};document.getElementById('nx').onclick=function(){go(i+1)};
  document.getElementById('bid').onclick=function(){lang='id';txt()};document.getElementById('ben').onclick=function(){lang='en';txt()};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(i+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1)});
  var x0=null,st=document.getElementById('stage');
  st.addEventListener('pointerdown',function(e){x0=e.clientX});
  st.addEventListener('pointerup',function(e){if(x0==null)return;var d=e.clientX-x0;x0=null;if(Math.abs(d)>40)go(i+(d<0?1:-1));else{var r=st.getBoundingClientRect();go(i+(e.clientX>r.left+r.width/2?1:-1))}});
  st.addEventListener('pointercancel',function(){x0=null});
  document.getElementById('cl').onclick=function(){try{parent.postMessage('evo-tut-close','*')}catch(e){}};
  if(/en/.test(location.hash))lang='en';
  txt();go(0);
})();
</script>
</body></html>
